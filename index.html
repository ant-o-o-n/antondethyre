<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Anton Dethyre — Photographe</title>
  <meta name="description" content="Anton Dethyre, photographe né en Suède, étudiant à l'École nationale supérieure des Arts Décoratifs (ENSAD) de Paris. Travaille la photographie et l'image en mouvement autour de la montagne, du paysage et des territoires — Annecy, Val Thorens, Kiruna.">
  <meta name="author" content="Anton Dethyre">
<meta name="keywords" content="Anton Dethyre, photographe, ENSAD, Paris, photographie, vidéo, son, franco-suédois, Kiruna, Annecy, Val Thorens, montagne, paysage, art contemporain">

<!-- Open Graph -->
<meta property="og:title" content="Anton Dethyre — Photographe et Vidéaste">
<meta property="og:description" content="Anton Dethyre, photographe et vidéaste franco-suédois, étudiant à l'ENSAD Paris.">
<meta property="og:url" content="https://antondethyre.fr">
<meta property="og:type" content="website">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Bandeau blanc pleine largeur sous Anton Dethyre quand ouvert -->
  <div id="tree-header-bg"></div>

  <!-- Anton Dethyre seul, fixe, animé vers le haut au clic -->
  <div id="tree-header"></div>

  <!-- Dossiers, scrollables, alignés dynamiquement -->
  <div id="tree-view">
    <div id="tree"></div>
  </div>

  <div id="gallery" class="hidden">
    <button id="gallery-close" aria-label="Fermer">×</button>
    <div id="gallery-container">
      <img id="gallery-img" src="" alt="">
      <iframe id="gallery-iframe" src="" allow="autoplay; fullscreen; picture-in-picture" allowfullscreen></iframe>
    </div>
    <div id="breadcrumb"></div>
  </div>

  <div id="hover-preview">
    <img id="preview-img" src="" alt="">
  </div>

  <script src="script.js"></script>
</body>
</html>
